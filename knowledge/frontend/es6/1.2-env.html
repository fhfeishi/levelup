// 异步

// Promise
// 从语法上说，Promise 是一个对象，从它可以获取异步操作的消息。
// Promise 状态
// Promise 有三种状态：
// 1. pending（等待中）：初始状态，既不是成功，也不是失败   
// 2. fulfilled（已兑现）：操作成功完成
// 3. rejected（已拒绝）：操作失败
// 除了异步操作的结果，任何其他操作都无法改变这个状态。
// Promise 对象只有：从 pending 变为 fulfilled 和从 pending 变为 rejected 的状态改变。只要处于 fulfilled 和 rejected ，
// 状态就不会再变了即 resolved（已定型）。


const p = new Promise(function(resolve,reject){
  resolve(1);
}).then(function(value){ // 第一个then // 1
  console.log(value);
  return value * 2;
}).then(function(value){ // 第二个then // 2
  console.log(value);
}).then(function(value){ // 第三个then // undefined
  console.log(value);
  return Promise.resolve('resolve'); 
}).then(function(value){ // 第四个then // resolve
  console.log(value);
  return Promise.reject('reject'); 
})
.then(
  function(value){ 
    // 第五个then //reject:reject !!!这里不会打印,
    //因为上一个then方法返回的是一个reject状态的promise
    console.log('resolve:' + value);
  }, 
  function(err) {
    // 此行会打印, 因第五个than只能接受 resolve状态的promise, 而第四个than返回的是reject状态的promise
    // 所以会被本行 err 捕获
    console.log('reject:' + err);
  }
);

  console.log('start');
  yield 1;
